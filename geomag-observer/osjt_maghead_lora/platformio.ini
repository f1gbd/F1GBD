; =========================================================================
; OSJT — osjt_maghead_lora
; Tete magnetique RM3100 sur Heltec WiFi LoRa 32 V4
; =========================================================================
;
;   pio run -e heltec_v4_node          ; la tete LoRa, dans le tube
;   pio run -e heltec_v4_gateway       ; la passerelle LoRa, sur le PC
;   pio run -e heltec_v4_node_wifi     ; la tete WiFi, sur le reseau local
;
; TROIS ROLES, UN SEUL CODE
; -------------------------
; Ils partagent la definition des trames et le CRC. Les separer en projets
; distincts, c'est se garantir qu'ils divergeront un jour sur un champ, et
; passer une soiree a chercher pourquoi le PC rend des valeurs absurdes.
; Un seul arbre, trois environnements, un -DOSJT_ROLE.
;
; LoRa OU WiFi POUR LA TETE ?
; ---------------------------
; Ce sont deux usages, pas deux camps.
;
;   LoRa  tete eloignee, sur accu ou solaire. Cinq jours et demi sur
;         3000 mAh, une trame par minute, fenetrage d'emission complet.
;   WiFi  tete sur terrasse ou en jardin, SECTEUR A PORTEE. Un jour et demi
;         seulement sur accu, mais plus de rapport cyclique a respecter :
;         une trame par seconde, et pas de carte passerelle a prevoir.
;
; Le cout magnetique du WiFi se compense par la distance : facteur 2,6 en
; courant de crete, donc 1,37 en deport, le champ d'une boucle decroissant
; en 1/r cube. Les 30 cm minimum de la tete LoRa deviennent 41 cm ; les
; 50 cm recommandes conviennent aux deux.
;
; CARTE : V4 ou V3 ?
; ------------------
; Le V4 conserve le facteur de forme et le brochage du V3 ; PlatformIO n'a
; pas encore de board dedie, on garde donc celui du V3. Les differences qui
; comptent ici — PSRAM, interface solaire, puissance d'emission — ne
; changent rien au brochage.
;
; Le firmware tourne aussi sur un V3 : moins de PSRAM, pas d'entree
; solaire, mais le SX1262 et le RM3100 se pilotent pareil.

[platformio]
default_envs = heltec_v4_node

[env]
platform  = espressif32
board     = heltec_wifi_lora_32_V3
framework = arduino

monitor_speed = 115200
monitor_filters = time, colorize

lib_deps =
    jgromes/RadioLib @ ^7.1.0
    olikraus/U8g2 @ ^2.35.30

build_flags =
    -DOSJT_FW_VERSION=\"0.2.0\"
    -Wall
    ; OSJT_OLED N'EST PAS DEFINI ICI.
    ;
    ; Le poser dans [env] puis le redefinir dans chaque role donne
    ; « -DOSJT_OLED=0 -DOSJT_OLED=1 » sur la meme ligne de commande, et gcc
    ; emet un « warning: OSJT_OLED redefined » PAR UNITE DE COMPILATION —
    ; plusieurs centaines de lignes de bruit qui noient les vrais messages.
    ;
    ; Chaque environnement le definit donc une fois, et une seule.
    ; osjt_oled.h retombe sur 0 s'il n'est pas defini du tout.
    ; Frequence en Hz. 868,1 MHz est dans la sous-bande g1 (868,0-868,6),
    ; limitee a 1 % de rapport cyclique et 14 dBm PAR.
    -DOSJT_LORA_FREQ_HZ=868100000
    -DOSJT_LORA_SF=7
    -DOSJT_LORA_BW_KHZ=125.0
    -DOSJT_LORA_CR=5
    -DOSJT_LORA_SYNC=0x34
    ; 14 dBm PAR reglementaire. Le V4 haute puissance sait monter a 28 dBm :
    ; ce serait illegal dans cette sous-bande, et parfaitement inutile pour
    ; une portee de quelques centaines de metres.
    -DOSJT_LORA_DBM=14
    ; Garde-fou logiciel de rapport cyclique, en pour-mille. La limite
    ; legale est 10 pour-mille ; on se garde une marge.
    -DOSJT_DUTY_PERMILLE=8

; -------------------------------------------------------------------------
[env:heltec_v4_node]
; Ne compiler QUE le source du noeud. Sans ce filtre, gateway.cpp est compile
; et lie dans l'image du noeud : ses objets statiques — un second SX1262 sur
; les memes broches — sont construits au demarrage, pour du code qui ne sera
; jamais appele. Meme raison pour node_wifi.cpp, qui embarquerait en plus
; toute la pile WiFi dans une image qui ne s'en sert pas.
build_src_filter = +<*> -<gateway.cpp> -<node_wifi.cpp> -<provisioning.cpp>
build_flags =
    ${env.build_flags}
    -DOSJT_ROLE=1
    ; OLED ALLUME AU DEMARRAGE, PUIS COUPE.
    ; Son cout n'existe que pendant qu'il est allume : vingt secondes avant
    ; la premiere mesure ne coutent rien, et voir la tete s'autotester avant
    ; de la descendre dans le tube vaut largement ces vingt secondes.
    ; Mettre 0 pour ne jamais l'allumer du tout.
    -DOSJT_OLED=1
    ; Duree de l'ecran d'accueil et de l'autotest, en secondes.
    -DOSJT_OLED_BOOT_S=20
    ; Cadence RM3100. TMRC=0x96 donne ~37 Hz ; on n'a besoin que de 10 Hz
    ; pour de la donnee a la minute, et la consommation suit.
    -DOSJT_TMRC=0x99
    -DOSJT_CYCLE_COUNT=800
    ; Sous-cadencer : lire un capteur a 10 Hz ne demande aucune puissance
    ; de calcul, et la signature magnetique du module chute avec sa
    ; consommation. 80 MHz au lieu de 240.
    -DOSJT_CPU_MHZ=80

; -------------------------------------------------------------------------
[env:heltec_v4_gateway]
; Idem : la passerelle n'a que faire du pilote RM3100 et de son bus SPI.
build_src_filter = +<*> -<node.cpp> -<node_wifi.cpp> -<provisioning.cpp>
build_flags =
    ${env.build_flags}
    -DOSJT_ROLE=2
    ; OLED ALLUME. La passerelle est sur le bureau, il n'y a aucun
    ; magnetometre a proximite, et un ecran repond a la seule question qu'on
    ; se pose devant elle : est-ce que ca recoit ?
    -DOSJT_OLED=1
    -DOSJT_CPU_MHZ=160

; -------------------------------------------------------------------------
[env:heltec_v4_node_wifi]
; La tete WiFi : le capteur et la pile IP, sans une ligne de LoRa. Le
; SX1262 reste sur la carte, simplement il n'est pas initialise — un
; peripherique qu'on n'allume pas ne consomme pas et n'emet pas.
build_src_filter = +<*> -<node.cpp> -<gateway.cpp>
build_flags =
    ${env.build_flags}
    -DOSJT_ROLE=3
    ; MEME ECRAN QUE LA TETE LoRa, ET POUR LA MEME RAISON : l'autotest doit
    ; se voir avant de refermer le boitier. Ici il affiche en plus l'adresse
    ; IP obtenue — sans quoi on repart avec un mat installe et rien qui
    ; arrive sur le PC.
    -DOSJT_OLED=1
    -DOSJT_OLED_BOOT_S=20
    ; Cadence RM3100. Plus rapide que la tete LoRa : sans rapport cyclique
    ; a tenir on emet a la seconde, et moyenner une vingtaine
    ; d'echantillons par trame vaut mieux que d'en moyenner deux.
    -DOSJT_TMRC=0x96
    -DOSJT_CYCLE_COUNT=800
    ; Une trame par seconde. C'est la cadence a laquelle la chaine de
    ; traitement du PC a ete eprouvee, et celle qui rend le dB/dt le plus
    ; juste.
    -DOSJT_WIFI_PERIOD_MS=1000
    ; 80 MHz est le minimum pour la radio WiFi ; nodeWifiSetup() le pose
    ; lui-meme, cette valeur n'est la que pour memoire.
    -DOSJT_CPU_MHZ=80
