; ============================================================================
;  Micro Radar - portage Waveshare Touch-AMOLED-2.06 (dalle CO5300 410x502)
;
;  Deux environnements :
;    esp32-s3-amoled-206  (defaut) -> ESP32-S3-Touch-AMOLED-2.06, PSRAM 8 Mo
;    esp32-c6-amoled-206           -> ESP32-C6-Touch-AMOLED-2.06, sans PSRAM
;
;    pio run                      -> compile les deux
;    pio run -e esp32-s3-amoled-206 -t upload
;    pio run -e esp32-c6-amoled-206 -t upload
;
;  Le paquet "espressif32" officiel de PlatformIO ne fournit PAS le framework
;  Arduino pour l'ESP32-C6 : on utilise le fork "pioarduino" pour les deux.
;    https://github.com/pioarduino/platform-espressif32/releases
;
;  NE PAS ajouter "lib_ldf_mode = deep+" : avec arduino-esp32 3.x le Library
;  Dependency Finder casse alors les includes des bibliotheques integrees au
;  framework (erreur "Network.h: No such file or directory" dans WiFi).
; ============================================================================

[platformio]
default_envs = esp32-s3-amoled-206

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
framework = arduino

board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = huge_app.csv

; genere aussi un binaire unique flashable a 0x0 (ESP Web Tools)
extra_scripts = post:tools/merge_bin.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Wall
    ; --- USB-C natif : Serial = USB Serial/JTAG (HWCDC) ---
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLGFX_USE_V1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    ; Panel_CO5300 + bus QSPI : presents depuis la 1.2.26
    lovyan03/LovyanGFX@^1.2.26
    tzapu/WiFiManager
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson


; ---------------------------------------------------------------------------
;  Waveshare ESP32-S3-Touch-AMOLED-2.06
;  ESP32-S3 double coeur 240 MHz, 16 Mo Flash, 8 Mo PSRAM OPI
; ---------------------------------------------------------------------------
[env:esp32-s3-amoled-206]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi   ; Flash QIO + PSRAM OPI

; --- port USB-C ---
upload_port = COM2
monitor_port = COM2

build_flags =
    ${env.build_flags}
    -DMICRORADAR_BOARD_S3=1
    -DBOARD_HAS_PSRAM


; ---------------------------------------------------------------------------
;  Waveshare ESP32-C6-Touch-AMOLED-2.06
;  ESP32-C6 RISC-V 160 MHz, 16 Mo Flash, PAS de PSRAM
; ---------------------------------------------------------------------------
[env:esp32-c6-amoled-206]
board = esp32-c6-devkitc-1

; --- port USB-C : a ajuster (pio device list) ---
; upload_port = COMxx
; monitor_port = COMxx

build_flags =
    ${env.build_flags}
    -DMICRORADAR_BOARD_C6=1
    -DBOARD_HAS_PSRAM=0
